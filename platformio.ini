; PlatformIO project configuration for TomagachiMouse
;
; Targets: ESP32-S3-DevKitC-1 (primary) and ESP32-S2-DevKitM-1 (secondary).
; Both boards expose a USB-OTG port that TinyUSB uses for HID.
;
; Quick start:
;   pio run -e esp32s3 -t upload       (ESP32-S3-DevKitC-1)
;   pio run -e esp32s2 -t upload       (ESP32-S2-DevKitM-1)
;   pio device monitor -e esp32s3      (optional serial debug — needs USB CDC)

[platformio]
src_dir = firmware/TomagachiMouse

; ── shared settings ───────────────────────────────────────────────────
[env_base]
framework   = arduino
; Espressif Arduino core ≥ 2.0.14 bundles TinyUSB; pin to a stable release.
platform    = espressif32 @ ^6.9.0
build_flags =
    ; USB_MODE=0 → USB-OTG / TinyUSB  (not the built-in HWCDC)
    -DARDUINO_USB_MODE=0
    ; Disable CDC-on-boot so the USB port presents ONLY as HID mouse
    -DARDUINO_USB_CDC_ON_BOOT=0
monitor_speed = 115200

; ── ESP32-S3-DevKitC-1  (recommended) ────────────────────────────────
[env:esp32s3]
extends     = env_base
board       = esp32-s3-devkitc-1
; UART0 upload (via USB-Serial bridge on pin 43/44 on DevKitC-1)
upload_protocol = esptool

; ── ESP32-S2-DevKitM-1 ───────────────────────────────────────────────
[env:esp32s2]
extends     = env_base
board       = esp32-s2-devkitm-1
upload_protocol = esptool
